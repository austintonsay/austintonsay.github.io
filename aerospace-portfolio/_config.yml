title: "Your Name | Aerospace Engineering"
description: "Aerospace engineering student portfolio focused on flight, structures, propulsion, and systems."
url: "https://YOUR-USERNAME.github.io"
baseurl: ""

author:
  name: "Your Name"
  email: "you@example.com"

theme: null
markdown: kramdown
permalink: pretty

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

