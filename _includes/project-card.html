<article class="project-card{% if include.project.image %} project-card--image{% endif %} reveal">
  {% if include.project.image %}
    <div class="project-card__media" aria-hidden="true">
      <img src="{{ include.project.image | relative_url }}" alt="" style="object-position: {{ include.project.image_position | default: 'center' }}; object-fit: {{ include.project.image_fit | default: 'cover' }};">
    </div>
  {% endif %}
  <a href="{{ include.project.url | relative_url }}" aria-label="Read the {{ include.project.title }} case study">
    <div class="project-card__topline">
      <span>{{ include.project.category }}</span>
      <span>{{ include.project.year }}</span>
    </div>
    <div class="project-card__content">
      <div>
        <h3>{{ include.project.title }}</h3>
        <p>{{ include.project.summary }}</p>
      </div>
      <span class="project-card__arrow">{% include icon.html name="arrow" %}</span>
    </div>
    <ul class="tag-list" aria-label="Tools used">
      {% for tool in include.project.tools limit: 4 %}<li>{{ tool }}</li>{% endfor %}
    </ul>
  </a>
</article>
