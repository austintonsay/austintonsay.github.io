---
layout: default
title: "Aerospace Engineering Portfolio"
---
{% assign profile = site.data.profile %}

<header class="site-header" data-header>
  <a class="brand" href="#top" aria-label="Go to top">
    <span class="brand__mark">{{ profile.monogram }}</span>
    <span>{{ profile.name }}</span>
  </a>
  <nav class="desktop-nav" aria-label="Primary navigation">
    <a href="#work">Work</a>
    <a href="#experience">Experience</a>
    <a href="#education">Education</a>
    <a href="#about">About</a>
    <a class="nav-cta" href="{{ profile.resume_url | relative_url }}">Résumé</a>
  </nav>
  <button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false" data-menu-button>
    {% include icon.html name="menu" %}
  </button>
  <nav class="mobile-nav" aria-label="Mobile navigation" data-mobile-nav>
    <a href="#work">Work</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#about">About</a><a href="{{ profile.resume_url | relative_url }}">Résumé</a>
  </nav>
</header>

<main id="main">
  <section class="visual-zone" id="top" data-parallax>
    <div class="visual-zone__media" aria-hidden="true">
      <img src="{{ '/assets/images/orbital-horizon.png' | relative_url }}" alt="" data-parallax-image>
    </div>
    <div class="visual-zone__shade" aria-hidden="true"></div>

    <div class="hero shell">
      <div class="hero__copy reveal">
        <p class="eyebrow">{{ profile.eyebrow }}</p>
        <h1 aria-label="{{ profile.headline }}">
          {% for line in profile.headline_lines %}
            <span aria-hidden="true">{{ line }}</span>
          {% endfor %}
        </h1>
        <p class="hero__intro">{{ profile.intro }}</p>
        <div class="hero__actions">
          <a class="button button--light" href="#work">View selected work</a>
          {% if profile.resume_url %}<a class="button button--ghost" href="{{ profile.resume_url | relative_url }}">Download résumé</a>{% endif %}
        </div>
      </div>
      <a class="hero__scroll reveal" href="#approach">
        <span>Scroll down</span>
        <i aria-hidden="true"></i>
      </a>
    </div>

    <div class="approach shell" id="approach">
      <div class="approach__heading reveal">
        <p class="eyebrow">ENGINEERING APPROACH</p>
        <h2>From equations<br>to evidence.</h2>
      </div>
      <ol class="principles">
        {% for principle in profile.principles %}
          <li class="principle reveal">
            <span>{{ principle.number }}</span>
            <div><h3>{{ principle.title }}</h3><p>{{ principle.text }}</p></div>
          </li>
        {% endfor %}
      </ol>
    </div>
  </section>

  <div class="surface">
    <section class="section shell" id="work">
      <div class="section-heading reveal">
        <div><p class="eyebrow">SELECTED WORK</p><h2>Projects built around a question.</h2></div>
        <p>Each case study shows the problem, the physics, the decision, and the evidence—not just the final render.</p>
      </div>
      <div class="project-grid">
        {% assign sorted_projects = site.projects | sort: "order" %}
        {% for project in sorted_projects %}
          {% include project-card.html project=project %}
        {% endfor %}
      </div>
    </section>

    <section class="section section--ruled shell" id="experience">
      <div class="section-heading reveal">
        <div><p class="eyebrow">EXPERIENCE</p><h2>Where I’ve contributed.</h2></div>
      </div>
      <div class="timeline">
        {% for item in site.data.experience %}
          <article class="timeline-item reveal">
            <p class="timeline-item__period">{{ item.period }}</p>
            <div><h3>{{ item.role }}</h3><p class="timeline-item__org">{{ item.organization }}</p></div>
            <div><p>{{ item.summary }}</p><ul>{% for highlight in item.highlights %}<li>{{ highlight }}</li>{% endfor %}</ul></div>
          </article>
        {% endfor %}
      </div>
    </section>

    <section class="section shell" id="education">
      {% assign education = site.data.education %}
      <div class="section-heading reveal">
        <div><p class="eyebrow">EDUCATION</p><h2>Engineering foundation.</h2></div>
      </div>
      <div class="education-block reveal">
        <div>
          <h3>{{ education.institution }}</h3>
          <p>{{ education.degree }} · {{ education.gpa }}</p>
        </div>
        <p>{{ education.graduation }}</p>
      </div>
      <div class="coursework-list">
        {% for course in education.coursework %}
          <article class="coursework-item reveal">
            <h3>{{ course.code }}</h3>
            <p>{{ course.description }}</p>
          </article>
        {% endfor %}
      </div>
    </section>

    <section class="section section--ruled shell" id="about">
      <div class="about-grid">
        <div class="reveal">
          <p class="eyebrow">ABOUT</p>
          <h2>{{ profile.about_heading }}</h2>
          <p class="about-grid__body">{{ profile.about_body }}</p>
        </div>
        <dl class="metrics reveal">
          {% for metric in profile.metrics %}<div><dt>{{ metric.value }}</dt><dd>{{ metric.label }}</dd></div>{% endfor %}
        </dl>
      </div>
      <div class="skills-grid">
        {% for skill_group in site.data.skills %}
          <article class="skill-card reveal">
            {% include icon.html name=skill_group.icon %}
            <h3>{{ skill_group.group }}</h3>
            <ul>{% for item in skill_group.items %}<li>{{ item }}</li>{% endfor %}</ul>
          </article>
        {% endfor %}
      </div>
      <div class="affiliations reveal">
        <p class="eyebrow">MEMBERSHIPS & AFFILIATIONS</p>
        <div>
          {% for affiliation in site.data.affiliations %}
            <p><span>{{ affiliation.name }}</span><span>{{ affiliation.period }}</span></p>
          {% endfor %}
        </div>
      </div>
    </section>

    <section class="contact-section">
      <div class="shell contact-section__inner reveal">
        <p class="eyebrow">NEXT TRAJECTORY</p>
        <h2>Let’s build something that flies.</h2>
        <p>{{ profile.availability }} · {{ profile.location }}</p>
        <div class="contact-links">
          {% if profile.email != "" %}<a href="mailto:{{ profile.email }}">{{ profile.email }} {% include icon.html name="arrow" %}</a>{% endif %}
          <a href="tel:+15622136508">{{ profile.phone }} {% include icon.html name="arrow" %}</a>
          <a href="{{ profile.linkedin }}">LinkedIn {% include icon.html name="arrow" %}</a>
          <a href="{{ profile.github }}">GitHub {% include icon.html name="arrow" %}</a>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="shell footer__inner">
    <p>© {{ "now" | date: "%Y" }} {{ profile.name }} · Built with Jekyll.</p>
    <a href="#top">Back to orbit ↑</a>
  </div>
</footer>
